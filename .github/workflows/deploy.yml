name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via SSH
        run: |
          REMOTE_ROOT="/var/www/kunming-afchine.org"
          SSH_OPTS="-i ~/.ssh/vps_key -o StrictHostKeyChecking=no -o IdentitiesOnly=yes"
          TARGET="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"

          FILES="templates/shaper_languageschool/index.php \
            templates/shaper_languageschool/css/custom.css \
            templates/shaper_languageschool/css/template.css \
            templates/shaper_languageschool/css/presets/preset1.css \
            falang-inject/sppb5.php \
            templates/shaper_languageschool/html/com_rseventspro/rseventspro/show.php \
            templates/shaper_languageschool/html/mod_rseventspro_upcoming/default.php \
            language/fr-FR/fr-FR.com_rseventspro.ini \
            language/zh-CN/zh-CN.com_rseventspro.ini \
            language/fr-FR/fr-FR.tpl_shaper_languageschool.ini \
            language/zh-CN/zh-CN.tpl_shaper_languageschool.ini \
            templates/shaper_languageschool/html/com_content/category/blog.php \
            robots.txt \
            .htaccess"

          tar cf - $FILES | ssh $SSH_OPTS $TARGET \
            "sudo tar xf - -C $REMOTE_ROOT && cd $REMOTE_ROOT && sudo chown www-data:www-data $FILES"
